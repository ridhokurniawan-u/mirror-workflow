name: mirror-to-gitlab

on:
  push:
    branches:
      - 'main'

jobs:
  mirror:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - name: Debug
        env:
          GLUSER: ${{ secrets.GLUSER }}
          GLPASS: ${{ secrets.GLPASS }}
        run: |
          echo "GLUSER length: ${#GLUSER}"
          echo "GLPASS length: ${#GLPASS}"
          
      - name: push to gitlab
        run: |
          git remote add gitlab https://${{ secrets.GLUSER }}:${{ secrets.GLPASS }}@gitlab.mertani.com/mertani-software/github-mirror.git
          git push --force gitlab main
        
